name: "Setup Bun"
description: "Setup Bun with caching and install dependencies"
inputs:
  install-flags:
    description: "Additional flags to pass to 'bun install'"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    # node-gyp@latest (invoked via bunx for native install scripts) requires Node >=22;
    # some runner images ship an older system Node on PATH
    - name: Setup Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "24"

    - name: Get Bun version and baseline download URL
      id: bun-url
      shell: bash
      run: |
        V=$(node -p "require('./package.json').packageManager.split('@')[1]")
        # Bun 1.4.2 includes the patched peer-variant fix in oven-sh/bun#33646.
        if [ "$RUNNER_OS" = "Windows" ]; then V=1.4.2; fi
        echo "version=$V" >> "$GITHUB_OUTPUT"
        if [ "$RUNNER_ARCH" = "X64" ]; then
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      id: setup-bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ !steps.bun-url.outputs.url && steps.bun-url.outputs.version || '' }}
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    - name: Get cache directory
      id: cache
      shell: bash
      run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

    - name: Restore Bun dependencies
      id: bun-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-

    - name: Install setuptools for distutils compatibility
      run: python3 -m pip install setuptools || pip install setuptools || true
      shell: bash

    - name: Install dependencies
      # Hoisted on Windows, measured rather than assumed: dropping this flag cost `unit (windows)`
      # 11 failures on one run and 14 on the next, every one a CLI subprocess timing out at 15s
      # waiting for `opencode serve`, while the suite's own duration and the other three jobs did
      # not move. An isolated layout resolves through far more junctions there, which costs a
      # process launch without costing the tests. Upstream's Bun 1.4.2 pin above is a separate fix,
      # for the patched-peer rename, and stays either way.
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then
          bun install --linker hoisted ${{ inputs.install-flags }}
        else
          bun install ${{ inputs.install-flags }}
        fi
      shell: bash

    - name: Save Bun dependencies
      if: steps.bun-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('**/bun.lock') }}
